# ============================================================
# Pulse 看板 Nginx 反向代理示例
# 放到 /etc/nginx/conf.d/kanban.conf 后执行：
#   nginx -t && systemctl reload nginx
# ============================================================

# 上游：应用本体（systemd / 裸进程部署在 127.0.0.1:4173）
upstream kanban_upstream {
    server 127.0.0.1:4173;
    keepalive 16;
}

# ---------- HTTP ----------
server {
    listen 80;
    # 改成你的域名或服务器 IP
    server_name kanban.example.com;

    # 静态资源压缩（应用本体不压缩，交给 Nginx 统一处理）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 上传体积与请求体上限对齐（应用默认 256KB）
    client_max_body_size 1m;

    location / {
        proxy_pass http://kanban_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查供监控/负载均衡探活
    location = /api/health {
        proxy_pass http://kanban_upstream;
        access_log off;
    }
}

